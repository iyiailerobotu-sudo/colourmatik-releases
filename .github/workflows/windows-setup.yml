# Build the one-click Windows installer colourMatik-windows-setup.exe (NSIS) on a
# Windows runner, and optionally attach it to a release. The Setup carries the
# whole program (windows/setup/build-setup.ps1 packs the committed tree), so
# installing downloads nothing from GitHub.
# Downloads live on fixed tags: attach to "windows-latest" (the site's link) and
# to the versioned copy "win-vX.Y.Z".
#
# Run by hand only (Actions > windows-setup > Run workflow). It used to start on
# every push to main that touched windows/setup - account protection: no
# automatic or scheduled builds.
name: windows-setup
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attach colourMatik-windows-setup.exe to (e.g. windows-latest or win-v1.8.2); empty = build only"
        required: false
        default: ""

# needed so the release-attach step can replace existing assets
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build Setup.exe
        shell: pwsh
        run: ./windows/setup/build-setup.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: colourMatik-windows-setup
          path: windows/setup/colourMatik-windows-setup.exe

      - name: Attach to release
        if: ${{ inputs.release_tag != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" windows/setup/colourMatik-windows-setup.exe --clobber
